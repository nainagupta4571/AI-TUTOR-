<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Tutor - Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef1f7, #d1f4ff);
    }
    .login-box {
      width: 380px;
      max-width: 90%;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      text-align: center;
    }
    h1 { margin-bottom: 10px; }
    p { color: #666; }
    input {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: none;
      border-radius: 7px;
      background: #1976d2;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #1565c0; }
    #message { margin-top: 15px; font-weight: bold; }
    a { display: block; margin-top: 18px; color: #1976d2; text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>📚 AI Tutor</h1>
    <p>Welcome back</p>

    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    <div id="message"></div>
    <a href="/register">Create an account</a>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');
    const apiBase = window.location.protocol === 'file:' ? 'http://localhost:5000' : '';

    if (window.location.protocol === 'file:') {
      message.style.color = 'blue';
      message.textContent = 'Opening through the local server...';
      window.location.replace('http://localhost:5000/login');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch(`${apiBase}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        if (response.ok) {
          localStorage.setItem('ai_tutor_token', data.token);
          localStorage.setItem('ai_tutor_user', JSON.stringify(data.user));
          message.style.color = 'green';
          message.textContent = 'Login successful!';
          setTimeout(() => {
            window.location.href = `${apiBase}/tutor`;
          }, 800);
        } else {
          message.style.color = 'red';
          message.textContent = data.message || 'Login failed';
        }
      } catch (error) {
        console.error(error);
        message.style.color = 'red';
        message.textContent = 'Could not connect to server.';
      }
    });
  </script>
</body>
</html>
